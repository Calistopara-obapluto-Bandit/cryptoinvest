      <stop offset="0" stop-color="#0B1D19" />
      <stop offset="1" stop-color="#050E0C" />
    </linearGradient>
    <linearGradient id="cwArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ECFBC" stop-opacity="0.40" />
      <stop offset="1" stop-color="#3ECFBC" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cwGlow" cx="0.82" cy="0.06" r="0.72">
      <stop offset="0" stop-color="#2AB7A4" stop-opacity="0.26" />
      <stop offset="1" stop-color="#2AB7A4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cwGlow2" cx="0.06" cy="0.95" r="0.6">
