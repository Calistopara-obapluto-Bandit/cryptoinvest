<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="cwDashTitle cwDashDesc" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <title id="cwDashTitle">Clearwave Crypto paper trading dashboard</title>
  <desc id="cwDashDesc">A simulated trading dashboard with a $28,412.65 demo portfolio, a seven-day balance chart, live BTC, ETH and SOL quotes, and a buy order ticket for $1,000.</desc>

  <defs>
