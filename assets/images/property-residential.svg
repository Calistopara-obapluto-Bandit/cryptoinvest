<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="cwResTitle cwResDesc">
  <title id="cwResTitle">Residential rental houses at dusk</title>
  <desc id="cwResDesc">Illustration of three townhouses with lit windows on a quiet street, representing the residential demo property portfolio.</desc>

  <defs>
    <linearGradient id="resSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051714" />
      <stop offset="0.55" stop-color="#0C312B" />
      <stop offset="1" stop-color="#175548" />
    </linearGradient>
    <radialGradient id="resMoonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DFF5EE" stop-opacity="0.30" />
      <stop offset="1" stop-color="#DFF5EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="resLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2B65A" stop-opacity="0.45" />
      <stop offset="1" stop-color="#F2B65A" stop-opacity="0" />
    </radialGradient>
    <pattern id="resWin" width="26" height="28" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="15" height="15" rx="2" fill="#F7C778" opacity="0.85" />
    </pattern>
    <pattern id="resWinDim" width="26" height="28" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="15" height="15" rx="2" fill="#8FD9CA" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="600" height="420" fill="url(#resSky)" />
  <circle cx="486" cy="74" r="72" fill="url(#resMoonGlow)" />
  <circle cx="486" cy="74" r="24" fill="#E8F7F1" opacity="0.92" />
  <circle cx="480" cy="70" r="4" fill="#CFEAE2" opacity="0.5" />
  <circle cx="494" cy="82" r="6" fill="#CFEAE2" opacity="0.35" />
  <g fill="#CFEAE2" opacity="0.5">
    <circle cx="72" cy="52" r="1.6" />
    <circle cx="146" cy="34" r="1.2" />
    <circle cx="238" cy="66" r="1.4" />
    <circle cx="332" cy="38" r="1.1" />
    <circle cx="412" cy="60" r="1.5" />
    <circle cx="548" cy="140" r="1.3" />
  </g>

  <!-- distant treeline -->
  <path d="M0 306 L96 262 L188 300 L276 256 L372 298 L468 262 L560 296 L600 276 V420 H0 Z" fill="#08211D" />
  <path d="M0 318 L110 292 L224 320 L338 288 L452 318 L566 294 L600 306 V420 H0 Z" fill="#061A17" />

  <!-- house one -->
  <path d="M14 240 L114 184 L214 240 Z" fill="#0A2520" stroke="#1D4A42" stroke-width="2" stroke-linejoin="round" />
  <rect x="30" y="240" width="168" height="118" fill="#0E2C27" />
  <rect x="148" y="198" width="16" height="34" fill="#0A231F" />
  <rect x="148" y="194" width="20" height="6" rx="2" fill="#17433B" />
  <rect x="48" y="260" width="52" height="42" fill="url(#resWin)" />
  <rect x="126" y="260" width="52" height="42" fill="url(#resWinDim)" />
  <rect x="90" y="308" width="32" height="50" rx="3" fill="#17433B" />
  <circle cx="97" cy="334" r="2.4" fill="#F2B65A" />
  <rect x="30" y="240" width="168" height="4" fill="#1D4A42" />

  <!-- house two (taller, centre) -->
  <path d="M198 198 L307 140 L416 198 Z" fill="#0B2A24" stroke="#245B51" stroke-width="2" stroke-linejoin="round" />
  <rect x="214" y="198" width="186" height="160" fill="#113530" />
  <rect x="214" y="198" width="186" height="5" fill="#245B51" />
  <rect x="352" y="150" width="18" height="44" fill="#0C2A24" />
  <rect x="352" y="146" width="22" height="6" rx="2" fill="#1D4A42" />
  <rect x="232" y="218" width="66" height="52" fill="url(#resWin)" />
  <rect x="316" y="218" width="66" height="52" fill="url(#resWinDim)" />
  <rect x="232" y="288" width="48" height="38" fill="url(#resWinDim)" />
  <rect x="322" y="296" width="40" height="62" rx="3" fill="#17433B" />
  <circle cx="330" cy="328" r="2.6" fill="#F2B65A" />
  <rect x="298" y="284" width="8" height="44" fill="#F2B65A" opacity="0.15" />

  <!-- house three -->
  <path d="M398 252 L490 206 L582 252 Z" fill="#0A2520" stroke="#1D4A42" stroke-width="2" stroke-linejoin="round" />
  <rect x="414" y="252" width="152" height="106" fill="#0D2A25" />
  <rect x="414" y="252" width="152" height="4" fill="#1D4A42" />
  <rect x="432" y="272" width="48" height="38" fill="url(#resWin)" />
  <rect x="498" y="272" width="48" height="38" fill="url(#resWin)" />
  <rect x="480" y="318" width="30" height="40" rx="3" fill="#17433B" />

  <!-- trees -->
  <g>
    <rect x="566" y="288" width="7" height="70" fill="#0A231F" />
    <circle cx="570" cy="270" r="30" fill="#0C352C" />
    <circle cx="552" cy="284" r="20" fill="#0A2C25" />
    <circle cx="588" cy="286" r="18" fill="#0F3B32" />
  </g>
  <g>
    <rect x="4" y="292" width="6" height="66" fill="#0A231F" />
    <circle cx="8" cy="272" r="26" fill="#0C352C" />
    <circle cx="22" cy="290" r="16" fill="#0A2C25" />
  </g>

  <!-- street lamp -->
  <circle cx="192" cy="288" r="46" fill="url(#resLamp)" />
  <rect x="189" y="282" width="5" height="82" fill="#1B463E" />
  <path d="M191 282h22l-6 10h-16z" fill="#1B463E" />
  <circle cx="206" cy="296" r="6" fill="#F7C778" />

  <!-- street -->
  <rect y="352" width="600" height="68" fill="#071915" />
  <path d="M0 358H600" stroke="#1B463E" stroke-width="3" />
  <g stroke="#254F46" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 22">
    <path d="M24 392H576" />
  </g>
  <rect y="410" width="600" height="10" fill="#051210" />
</svg>
